# One run per commit: backend and frontend in parallel, integration only after both succeed on the same SHA.
# No path filters, so a backend-only or frontend-only change still gets the integration verdict.
name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml
  frontend:
    uses: ./.github/workflows/frontend-ci.yml
  integration:
    needs: [backend, frontend]
    uses: ./.github/workflows/integration-ci.yml
