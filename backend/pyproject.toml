[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qualityops-ai"
version = "0.0.1"
description = "Evidence governed manufacturing quality investigation (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "numpy>=2.1,<3",
  "scikit-learn==1.9.1",
  "lightgbm==4.7.0",
  "reportlab>=4.2,<6",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pypdfium2>=4,<6",
  "tzdata>=2024.1",  # IANA zones on Windows, where the OS has none for zoneinfo
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/web/*", "static/web/assets/*", "fixtures/intake/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

