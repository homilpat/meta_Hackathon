<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QualityOps AI</title>
<style>
 body{font:14px system-ui,sans-serif;margin:0;background:#f6f7f9;color:#1a1d21}
 header{background:#1f3a5f;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center}
 main{display:grid;grid-template-columns:240px 1fr;gap:16px;padding:16px}
 section{background:#fff;border:1px solid #d9dde3;border-radius:6px;padding:12px;margin-bottom:12px}
 h2{font-size:15px;margin:0 0 8px} table{border-collapse:collapse;width:100%} td,th{border:1px solid #d9dde3;padding:4px 6px;text-align:left;vertical-align:top}
 button{margin:2px;padding:4px 10px} .case{cursor:pointer;padding:6px;border-radius:4px} .case:hover,.sel{background:#e4ecf7}
 .banner{background:#fff4d6;border:1px solid #e3c35a;padding:6px 8px;border-radius:4px;margin-bottom:8px}
 .LIVE{background:#d8f3e0;color:#1b6e3c;padding:1px 6px;border-radius:3px} .TEST_DOUBLE{background:#fde2c8;color:#8a4b00;padding:1px 6px;border-radius:3px}
 .OBSERVED{color:#1b6e3c}.CALCULATED{color:#1c4f9c}.HYPOTHESIS{color:#9a5b00}.UNKNOWN{color:#8a1f1f}
 #msg{padding:6px 16px;color:#8a1f1f;min-height:18px} code{font-size:11px;word-break:break-all}
</style>
<header><b>QualityOps AI</b> <span>SYNTHETIC data only</span>
 <label>User <select id="user"><option value="alice">alice (author)</option><option value="dave">dave (author)</option><option value="bob">bob (reviewer)</option><option value="carol">carol (reviewer)</option></select></label></header>
<div id="msg"></div>
<main>
 <div><section><h2>Cases</h2><div id="cases"></div><button id="new">New synthetic PCB case</button></section></div>
 <div id="detail"><section>Select a case.</section></div>
</main>
<script>
const $=id=>document.getElementById(id); let cur=null;
const uid=()=>crypto.randomUUID();
async function api(path,method='GET',body,idem){
  const h={'X-User':$('user').value}; if(body!==undefined)h['Content-Type']='application/json'; if(idem)h['Idempotency-Key']=idem;
  const r=await fetch(path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
  const t=await r.text(); let j; try{j=JSON.parse(t)}catch{j=t}
  if(!r.ok){$('msg').textContent=r.status+': '+(j.detail?JSON.stringify(j.detail):t);throw new Error(r.status)} $('msg').textContent=''; return j}
const note=b=>b==='DETERMINISTIC_TEMPLATE_NO_AI'?'no AI model used':'model output, accepted only after server-side ClaimValidator';
const link=id=>/^(PRED|XAI)-\d+$/.test(id)?`<a href="#" data-ev="${id}">${id}</a>`:esc(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadCases(){ const cs=await api('/cases'); $('cases').innerHTML=cs.map(c=>`<div class="case ${c.case_id===cur?'sel':''}" data-id="${esc(c.case_id)}">${esc(c.case_id)}</div>`).join('')||'<i>none</i>';
  document.querySelectorAll('.case').forEach(e=>e.onclick=()=>{cur=e.dataset.id;loadCases();loadDetail()}); $('new').style.display=$('user').value in {alice:1,dave:1}?'':'none'}
async function loadDetail(){
  if(!cur)return; const me=await api('/me'); let ev,iss,docs,tl,runs,preds;
  try{[ev,iss,docs,tl,runs,preds]=await Promise.all([api(`/cases/${cur}/evidence`),api(`/cases/${cur}/data-issues`),api(`/cases/${cur}/ncr`),api(`/cases/${cur}/timeline`),api(`/cases/${cur}/investigations`),api(`/cases/${cur}/predictions`)])}
  catch{$('detail').innerHTML='<section>No access to this case.</section>';return}
  const author=me.role==='AUTHOR', latest=docs[docs.length-1];
  let h=`<section><h2>Case ${esc(cur)}</h2>Evidence rows: ${ev.length} · data-quality issues: ${iss.length} (${[...new Set(iss.map(i=>i.code))].join(', ')})
   <br><button id="mk" ${author?'':'disabled'}>Create NCR draft</button><button id="as" ${author?'':'disabled'}>Assign bob as reviewer</button></section>`;
  h+=`<section><h2>SPI risk model (synthetic label)</h2><button id="pr" ${author?'':'disabled'}>Score boards with SPI model</button><p style="font-size:12px">Model output, not an inspection result. SHAP explains the model score, not the physical cause.</p>`+(preds.length?`<table><tr><th>Board</th><th>Risk</th><th>Threshold</th><th>Evidence</th></tr>${preds.map(p=>`<tr><td>${esc(p.target_key.join('/'))}</td><td>${p.risk_score.toFixed(3)}${p.above_threshold?' ▲':''}</td><td>${p.threshold.toFixed(3)}</td><td>${link(p.evidence_id)} ${link(p.xai_evidence_id)}</td></tr>`).join('')}</table>`:'')+`<div id="pd"></div></section>`;
  h+=`<section><h2>Model investigations</h2><button id="inv" ${author?'':'disabled'}>Run investigation (LIVE Meta model)</button>`+runs.map(r=>`<div style="border-top:1px solid #d9dde3;margin-top:8px;padding-top:6px"><b>Run ${r.run_id}</b> <span class="${r.mode}">${r.mode==='LIVE'?'LIVE Meta call':'TEST DOUBLE — not a Meta call'}</span> ${esc(r.model)} · <b>${r.status}</b> · rounds ${r.rounds} · tokens ${r.prompt_tokens}/${r.completion_tokens}<br>Tool calls: ${r.tool_calls.map(c=>`${esc(c.tool_name)}${c.ok?'':' (failed)'}`).join(', ')||'none'}${r.error?`<br>Error: ${esc(r.error)}`:''}${r.validation_errors.length?`<br>Rejected: ${r.validation_errors.map(esc).join('; ')}`:''}${r.report?`<br>Summary: ${esc(r.report.summary)}`:''}${author&&r.status==='VALIDATED'?`<br><button data-run="${r.run_id}">Create NCR from run ${r.run_id}</button>`:''}</div>`).join('')+`</section>`;
  for(const d of docs){ const mine=d.author_id===me.id, isLatest=d===latest;
    h+=`<section><h2>NCR v${d.version} — ${d.status}</h2><div class="banner">Draft generator: ${esc(d.builder)} (${note(d.builder)}). Author: ${esc(d.author_id)}</div>
    <table><tr><th>ID</th><th>Class</th><th>Statement</th><th>Evidence</th></tr>${d.claims.map(c=>`<tr><td>${c.claim_id}</td><td class="${c.classification}">${c.classification}</td><td>${esc(c.text)}</td><td>${c.evidence_ids.map(link).join(', ')||'-'}</td></tr>`).join('')}</table>
    <p>SHA-256 <code>${d.content_sha256}</code> · <a href="#" data-html="${d.version}">open HTML</a></p>
    ${d.decisions.map(x=>`<p>${x.action} by ${esc(x.actor_id)}: ${esc(x.comment)}</p>`).join('')}
    ${author&&mine&&isLatest&&d.status==='DRAFT'?`<button data-rr="${d.version}">Request review from bob</button><button data-rr="${d.version}" data-who="carol">…from carol</button>`:''}
    ${me.role==='REVIEWER'&&isLatest&&d.status==='IN_REVIEW'?'<input id="cm" placeholder="Comment"> '+['APPROVE','REJECT','REQUEST_INFO'].map(a=>`<button data-dec="${a}" data-v="${d.version}" data-sha="${d.content_sha256}">${a}</button>`).join(''):''}</section>`}
  h+=`<section><h2>Audit timeline</h2><table>${tl.map(t=>`<tr><td>${t.at}</td><td>${esc(t.actor_id)}</td><td>${t.event}</td><td>${esc(t.detail)}</td></tr>`).join('')}</table></section>`;
  $('detail').innerHTML=h;
  $('mk').onclick=async()=>{await api(`/cases/${cur}/ncr`,'POST',{},uid());loadDetail()};
  $('pr').onclick=async()=>{await api('/models/train','POST',{seed:11});await api(`/cases/${cur}/predictions`,'POST',{},uid());loadDetail()};
  document.querySelectorAll('[data-ev]').forEach(a=>a.onclick=e=>{e.preventDefault();showPred(a.dataset.ev,preds)});
  $('inv').onclick=async()=>{$('msg').textContent='Investigation running…';await api(`/cases/${cur}/investigations`,'POST',{},uid());loadDetail()};
  document.querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{await api(`/cases/${cur}/ncr`,'POST',{investigation_run_id:+b.dataset.run},uid());loadDetail()});
  $('as').onclick=async()=>{await api(`/cases/${cur}/assignments`,'POST',{user_id:'bob'});loadDetail()};
  document.querySelectorAll('[data-rr]').forEach(b=>b.onclick=async()=>{await api(`/cases/${cur}/ncr/${b.dataset.rr}/request-review`,'POST',{reviewer_id:b.dataset.who||'bob'},uid());loadDetail()});
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{const c=$('cm').value;await api(`/cases/${cur}/ncr/${b.dataset.v}/decision`,'POST',{decision:b.dataset.dec,comment:c,content_sha256:b.dataset.sha},uid());loadDetail()});
  document.querySelectorAll('[data-html]').forEach(a=>a.onclick=async e=>{e.preventDefault();const w=window.open('');w.document.write(await (await fetch(`/cases/${cur}/ncr/${a.dataset.html}/html`,{headers:{'X-User':$('user').value}})).text())});
}
function showPred(id,preds){const p=preds.find(p=>p.evidence_id===id||p.xai_evidence_id===id);const box=$('pd');if(!p){box.textContent='Not found';return}
  const max=Math.max(...Object.values(p.xai.contributions).map(Math.abs));
  box.innerHTML=`<h2>${esc(p.evidence_id)} / ${esc(p.xai_evidence_id)} — board ${esc(p.target_key.join('/'))}</h2>Risk ${p.risk_score.toFixed(4)} (threshold ${p.threshold.toFixed(4)}) · model v${p.model.model_version_id} ${esc(p.model.algorithm)} · ${esc(p.model.label_kind)}<br>Inputs: ${p.input_evidence_ids.map(esc).join(', ')}<br>Input hash <code>${p.input_sha256}</code> · artifact <code>${p.model.artifact_sha256}</code><br>${esc(p.xai.method)} · baseline ${p.xai.baseline.toFixed(3)} log-odds · additivity error ${p.xai.additivity_error.toExponential(1)}<table>${Object.entries(p.xai.contributions).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${p.features[k].toFixed(4)}</td><td>${v>=0?'+':''}${v.toFixed(3)}</td><td><div style="height:8px;width:${Math.round(120*Math.abs(v)/max)}px;background:${v>=0?'#b5523b':'#3b6fb5'}"></div></td></tr>`).join('')}</table><p class="banner">${esc(p.note)}</p>`;box.scrollIntoView()}
$('new').onclick=async()=>{const id='PCB-'+Date.now().toString(36).toUpperCase(); await api('/cases','POST',{case_id:id}); const b=await (await fetch('/synthetic/7')).json(); await api(`/cases/${id}/sources`,'POST',b); cur=id; await loadCases(); loadDetail()};
$('user').onchange=()=>{loadCases();loadDetail()}; loadCases();
</script></html>
