name: Frontend CI
on:
  workflow_call:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The served bundle is committed; a source change without a rebuild fails here.
      - run: git diff --exit-code -- ../backend/src/app/static/web && test -z "$(git status --porcelain -- ../backend/src/app/static/web)"
