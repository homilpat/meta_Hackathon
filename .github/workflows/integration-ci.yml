name: Integration CI
on:
  workflow_call:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python -m pip install -e '.[dev]'
        working-directory: backend
      # Real uvicorn on an Alembic-migrated scratch DB: /app bundle, /ui, access, validator, experience, approval, audit.
      - run: python -m scripts.integration_smoke
        working-directory: backend
      # Meta tool-calling contract with the TEST_DOUBLE (not LIVE) and the D0-D8 flows.
      - run: python -m pytest -q tests/test_s3_investigation.py tests/test_v5_5_g8.py tests/test_v5_5_g7_d7_d8.py tests/test_security.py
        working-directory: backend
